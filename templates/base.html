<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Global Exchange</title>
</head>

<body>
    {% if messages %}
    <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    {% block content %}
    {% endblock %}
</body>

</html>
