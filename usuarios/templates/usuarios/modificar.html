<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Usuario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save {
            background-color: #e67e22;
            color: white;
        }
        .btn-save:hover {
            background-color: #d35400;
        }
        .btn-back {
            background-color: #95a5a6;
            color: white;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            line-height: 22px;
        }
        .btn-back:hover {
            background-color: #7f8c8d;
        }
        .alerta {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Modificar Usuario: {{ usuario.nombre }} {{ usuario.apellido }}</h1>

    {% if mensaje %}
        <div class="alerta">
            {{ mensaje }}
        </div>
    {% endif %}

    <form method="POST" action="">
        {% csrf_token %}
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" value="{{ usuario.apellido }}" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono" value="{{ usuario.telefono|default_if_none:'' }}">
        </div>

        <div class="form-group">
            <label for="rol">Rol:</label>
            <input type="text" id="rol" name="rol" value="{{ usuario.rol }}">
        </div>

        <div class="buttons">
            <a href="{% url 'listar_usuarios' %}" class="btn-back">← Volver</a>
            <button type="submit" class="btn-save">Guardar Cambios</button>
        </div>
    </form>
</div>

</body>
</html>
