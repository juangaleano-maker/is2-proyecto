<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar CotizaciÃ³n</title>
    <!-- Incluir CSS global si existe o Bootstrap para estÃ©tica -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-box {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container container-box">
        <h2 class="mb-4 text-center">Modificar Cotización</h2>
        
        <div id="alert-container"></div>

        <form id="cotizacion-form">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="moneda_origen" class="form-label">Moneda Origen</label>
                <input type="text" class="form-control" id="moneda_origen" value="{{ cotizacion.get_moneda_origen_display }}" disabled>
            </div>

            <div class="mb-3">
                <label for="moneda_destino" class="form-label">Moneda Destino</label>
                <input type="text" class="form-control" id="moneda_destino" value="{{ cotizacion.get_moneda_destino_display }}" disabled>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="compra" class="form-label">Precio de Compra</label>
                    <input type="number" step="0.01" class="form-control" id="compra" value="{{ cotizacion.compra|stringformat:'f' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="venta" class="form-label">Precio de Venta</label>
                    <input type="number" step="0.01" class="form-control" id="venta" value="{{ cotizacion.venta|stringformat:'f' }}" required>
                </div>
            </div>

            <div class="d-grid gap-2 mt-4 d-md-flex justify-content-md-end">
                <a href="{% url 'analista_panel' %}" class="btn btn-secondary me-md-2">Cancelar</a>
                <button type="submit" class="btn btn-primary">Modificar Cotización</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('cotizacion-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            const data = {
                compra: parseFloat(document.getElementById('compra').value),
                venta: parseFloat(document.getElementById('venta').value)
            };

            fetch('/cotizaciones/api/modificar/{{ cotizacion.id }}/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json().then(data => ({status: response.status, body: data})))
            .then(result => {
                const alertContainer = document.getElementById('alert-container');
                if (result.status === 201) {
                    alertContainer.innerHTML = '<div class="alert alert-success">Cotización modificada exitosamente. Redirigiendo...</div>';
                    setTimeout(() => {
                        window.location.href = "{% url 'analista_panel' %}";
                    }, 1500);
                } else {
                    alertContainer.innerHTML = `<div class="alert alert-danger">Error: ${result.body.error || 'Ocurrió un error inesperado'}</div>`;
                }
            })
            .catch(error => {
                document.getElementById('alert-container').innerHTML = '<div class="alert alert-danger">Error de conexión con el servidor.</div>';
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
