<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Cotización</title>
    <!-- Incluir CSS global si existe o Bootstrap para estética -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-box {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container container-box">
        <h2 class="mb-4 text-center">Registrar Nueva Cotización</h2>
        
        <div id="alert-container"></div>

        <form id="cotizacion-form">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="moneda_origen" class="form-label">Moneda Origen</label>
                <select class="form-select" id="moneda_origen" required>
                    <option value="USD">Dólar Estadounidense (USD)</option>
                    <option value="PYG">Guaraní (PYG)</option>
                    <option value="ARS">Peso Argentino (ARS)</option>
                    <option value="BRL">Real Brasileño (BRL)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="moneda_destino" class="form-label">Moneda Destino</label>
                <select class="form-select" id="moneda_destino" required>
                    <option value="PYG" selected>Guaraní (PYG)</option>
                    <option value="USD">Dólar Estadounidense (USD)</option>
                    <option value="ARS">Peso Argentino (ARS)</option>
                    <option value="BRL">Real Brasileño (BRL)</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="compra" class="form-label">Precio de Compra</label>
                    <input type="number" step="0.01" class="form-control" id="compra" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="venta" class="form-label">Precio de Venta</label>
                    <input type="number" step="0.01" class="form-control" id="venta" required>
                </div>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Guardar Cotización</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('cotizacion-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            const data = {
                moneda_origen: document.getElementById('moneda_origen').value,
                moneda_destino: document.getElementById('moneda_destino').value,
                compra: parseFloat(document.getElementById('compra').value),
                venta: parseFloat(document.getElementById('venta').value)
            };

            fetch('/cotizaciones/api/registrar/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json().then(data => ({status: response.status, body: data})))
            .then(result => {
                const alertContainer = document.getElementById('alert-container');
                if (result.status === 201) {
                    alertContainer.innerHTML = '<div class="alert alert-success">Cotización guardada exitosamente.</div>';
                    document.getElementById('cotizacion-form').reset();
                } else {
                    alertContainer.innerHTML = `<div class="alert alert-danger">Error: ${result.body.error || 'Ocurrió un error inesperado'}</div>`;
                }
            })
            .catch(error => {
                document.getElementById('alert-container').innerHTML = '<div class="alert alert-danger">Error de conexión con el servidor.</div>';
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
